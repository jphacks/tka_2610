[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
    "tls-rustls",
    "json"
] }

# マイグレーションのチェックサム (SHA-384) の計算
sha2 = "0.10"

# v5 は seed の作品 id（assetId から毎回同じ id を作る）
uuid = { version = "1", features = ["serde", "v4", "v5"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

tower-http = { version = "0.6", features = [
    "cors",
    "fs",
    "compression-gzip",
    "set-header"
] }

# 画像のデコード・リサイズ・JPEGエンコード
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp"
] }

# 博物館GLBの事前gzip圧縮
flate2 = "1"

dotenvy = "0.15"

[profile.dev.package."*"]
# 依存クレート(特に画像処理)は開発ビルドでも最適化して高速に動かす
opt-level = 3
