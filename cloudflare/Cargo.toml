[package]
name = "memoria-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http"] }
worker-macros = { version = "0.8", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "multipart"] }
tower-service = "0.3"
wasm-bindgen = "=0.2.130"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
# 大きな JPEG を小さく読む (photo.rs)
jpeg-decoder = { version = "0.3", default-features = false }
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["serde", "v4", "v5", "js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std", "wasmbind"] }
# 写真の処理 (backend と同じ形式に対応する)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
